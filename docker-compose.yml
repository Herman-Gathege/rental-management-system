services:
  postgres:
    image: postgres:15
    container_name: rental_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rental_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: rental_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - rental_network

  redis:
    image: redis:7-alpine
    container_name: rental_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rental_network

  backend:
    build: ./backend
    container_name: rental_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
   
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    networks:
      - rental_network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: rental_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - rental_network

  caddy:
    image: caddy:2-alpine
    container_name: rental_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - rental_network

  backup:
    image: postgres:15
    container_name: rental_backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/pg-backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rental_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  caddy_data:
  caddy_config:

networks:
  rental_network:
    driver: bridge