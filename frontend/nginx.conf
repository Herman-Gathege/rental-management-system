server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: cache static assets (recommended for Vite builds)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Optional: better error handling for SPA
  error_page 404 /index.html;
}